<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cdefs%3E%3ClinearGradient id="g" x1="0%25" y1="0%25" x2="100%25" y2="100%25"%3E%3Cstop offset="0%25" stop-color="%2316a34a"/%3E%3Cstop offset="100%25" stop-color="%230ea5e9"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width="64" height="64" rx="14" fill="%23081a2a"/%3E%3Cpath d="M15 32h11l7-12 8 24 7-12h11" fill="none" stroke="url(%23g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/%3E%3C/svg%3E' />
  <title>Flow Mesh Control Plane</title>
  <style>
    :root {
      --bg: #071018;
      --bg-2: #0c1b28;
      --surface: rgba(11, 27, 40, 0.86);
      --surface-strong: #102739;
      --panel: rgba(16, 38, 56, 0.9);
      --line: rgba(168, 196, 214, 0.24);
      --line-soft: rgba(168, 196, 214, 0.12);
      --text: #ecf4f8;
      --muted: #9eb6c6;
      --accent: #24c78f;
      --accent-soft: #24c78f26;
      --warning: #f4b544;
      --danger: #f06b75;
      --blue: #4da6ff;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Sora", "Space Grotesk", "Avenir Next", sans-serif;
      background:
        radial-gradient(1000px 500px at 88% -10%, #1e506a4f, transparent 70%),
        radial-gradient(900px 480px at -8% 10%, #0d6d5940, transparent 62%),
        linear-gradient(165deg, var(--bg), var(--bg-2));
      min-height: 100vh;
    }

    .app {
      max-width: 1380px;
      margin: 0 auto;
      padding: 1.2rem;
      animation: page-load 450ms ease-out;
    }

    @keyframes page-load {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      border: 1px solid var(--line);
      background: linear-gradient(140deg, #0f2536, #0b1b2a 70%);
      border-radius: var(--radius-lg);
      padding: 1rem 1.1rem;
      box-shadow: 0 18px 40px #00000042;
      align-items: center;
    }

    .eyebrow {
      color: #f8c86b;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
      font-size: 0.72rem;
      margin-bottom: 0.35rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.4vw, 2.15rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .topbar-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.5rem 0.8rem;
      font-size: 0.82rem;
      color: #d6e8f3;
      background: #0f2638;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill.live {
      background: #0f352a;
      border-color: #2ab48a88;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--accent-soft); }
      70% { box-shadow: 0 0 0 8px #24c78f00; }
      100% { box-shadow: 0 0 0 0 #24c78f00; }
    }

    .tabs {
      margin-top: 0.95rem;
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid var(--line);
      color: var(--text);
      background: #0e2334;
      border-radius: 999px;
      padding: 0.54rem 0.92rem;
      cursor: pointer;
      font-weight: 700;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .tab:hover { transform: translateY(-1px); }

    .tab.active {
      background: linear-gradient(120deg, #1e5b4a, #158968);
      border-color: #3bc199;
    }

    #content {
      margin-top: 0.9rem;
      min-height: 65vh;
    }

    .workspace {
      display: grid;
      gap: 0.8rem;
      grid-template-columns: 250px 1fr 320px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 0.82rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 30px #0000002a;
    }

    .section-title {
      margin: 0;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #d0e1eb;
    }

    .nav-list {
      margin: 0.65rem 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.42rem;
    }

    .nav-item {
      border: 1px solid var(--line-soft);
      background: #10273b;
      border-radius: var(--radius-sm);
      padding: 0.58rem 0.65rem;
      display: flex;
      justify-content: space-between;
      gap: 0.55rem;
      font-size: 0.84rem;
      color: #d6e5ef;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.12rem 0.44rem;
      font-size: 0.72rem;
      color: #d8e8f2;
      background: #143044;
      white-space: nowrap;
    }

    .builder-main {
      display: grid;
      gap: 0.8rem;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .kpi-card {
      border: 1px solid var(--line-soft);
      background: var(--panel);
      border-radius: var(--radius-sm);
      padding: 0.65rem;
    }

    .kpi-label {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .kpi-value {
      margin-top: 0.34rem;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .canvas {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background:
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px),
        linear-gradient(155deg, #0d2334, #0c1f2f);
      background-size: 20px 20px, 20px 20px, auto;
      padding: 0.9rem;
      position: relative;
      min-height: 420px;
      overflow: hidden;
    }

    .canvas-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .canvas-tools {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .tool-btn {
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      padding: 0.32rem 0.62rem;
      font-size: 0.75rem;
      color: #cfe2ef;
      background: #10293c;
    }

    .stage {
      position: relative;
      min-height: 320px;
    }

    .connector {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, #27bd91, #67d4b3);
      opacity: 0.72;
      transform-origin: left center;
    }

    .node {
      position: absolute;
      width: 190px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.6rem;
      background: #102a3f;
      box-shadow: 0 12px 18px #0000002b;
      animation: node-in 350ms ease-out;
    }

    @keyframes node-in {
      from { transform: scale(0.96) translateY(6px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .node.type-trigger { border-color: #4da6ff88; }
    .node.type-llm { border-color: #24c78f88; }
    .node.type-tool { border-color: #f4b54488; }
    .node.type-approval { border-color: #f06b7588; }

    .node-kind {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .node-name {
      font-weight: 700;
      margin-top: 0.25rem;
      font-size: 0.9rem;
    }

    .node-meta {
      margin-top: 0.35rem;
      font-size: 0.77rem;
      color: #bfd6e4;
    }

    .inspector {
      display: grid;
      gap: 0.8rem;
    }

    .inspector .kv {
      margin-top: 0.62rem;
      display: grid;
      gap: 0.4rem;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 0.65rem;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: #10283a;
      padding: 0.46rem 0.55rem;
      font-size: 0.8rem;
      color: #cee1ec;
    }

    .row span:last-child {
      color: #fff;
      font-weight: 600;
      text-align: right;
    }

    .list {
      margin: 0.6rem 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.42rem;
    }

    .list li {
      border: 1px solid var(--line-soft);
      background: #0f2739;
      border-radius: 9px;
      padding: 0.52rem 0.6rem;
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.82rem;
      color: #d2e3ed;
    }

    .mono {
      font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
      font-size: 0.77rem;
      color: #d9e8f3;
    }

    .ops-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .ops-card {
      grid-column: span 4;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 0.8rem;
      box-shadow: 0 12px 28px #0000002a;
      animation: fade-slide 320ms ease-out;
    }

    .ops-card.wide { grid-column: span 8; }
    .ops-card.full { grid-column: span 12; }

    @keyframes fade-slide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ops-card h3 {
      margin: 0;
      font-size: 0.97rem;
      letter-spacing: 0.01em;
    }

    .ops-card p {
      margin: 0.42rem 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .chip-row {
      margin-top: 0.6rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .chip {
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      padding: 0.26rem 0.56rem;
      background: #112c41;
      color: #d5e6f1;
      font-size: 0.76rem;
    }

    .chip.warn { color: #ffd488; border-color: #f4b54455; }
    .chip.bad { color: #ffb4bc; border-color: #f06b7555; }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .kpi-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stage { min-height: 360px; }
    }

    @media (max-width: 850px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .topbar-actions {
        justify-content: flex-start;
      }

      .kpi-row {
        grid-template-columns: 1fr;
      }

      .ops-card,
      .ops-card.wide,
      .ops-card.full {
        grid-column: span 12;
      }

      .node {
        width: 175px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div>
        <div class="eyebrow">Flow Mesh Enterprise</div>
        <h1>Workflow Control Plane</h1>
        <p class="subtitle">Design, validate, and operate production workflows with policy checks and human approvals.</p>
      </div>
      <div class="topbar-actions">
        <span class="pill live"><span class="dot"></span>Gateway Online</span>
        <span class="pill">Tenant: acme-finance</span>
        <span class="pill">Region: us-east-1</span>
        <span class="pill">Build v0.3.0</span>
      </div>
    </section>

    <section class="tabs" id="tabs"></section>
    <section id="content"></section>
  </main>

  <script>
    const tabs = ["builder", "runs", "approvals", "admin", "observability"];
    const labels = {
      builder: "Builder",
      runs: "Runs",
      approvals: "Approvals",
      admin: "Admin",
      observability: "Observability"
    };

    const views = {
      runs: {
        cards: [
          {
            span: "wide",
            title: "Run Queue",
            text: "Monitor active runs and checkpoint progression across tenants.",
            list: [
              ["tr_9ca82f2", "Running | tool-exec"],
              ["tr_4db770a", "Completed | 2m 13s"],
              ["tr_1aa72cc", "Failed | timeout at node_5"]
            ]
          },
          {
            title: "Runtime Health",
            text: "Executor and queue health from workflow runtime service.",
            chips: ["Queue depth: 12", "Retries: 3", "Stuck nodes: 1"]
          },
          {
            title: "Replay Controls",
            text: "Safely replay from checkpoints with idempotency protection.",
            chips: ["Replay enabled", "Checkpointing on", "Escalations: 2"]
          },
          {
            span: "full",
            title: "Execution Signals",
            text: "Recent events from the execution bus.",
            list: [
              ["Policy check passed", "13:18:21 UTC"],
              ["Approval requested", "13:17:44 UTC"],
              ["Tool timeout retry scheduled", "13:16:09 UTC"]
            ]
          }
        ]
      },
      approvals: {
        cards: [
          {
            span: "wide",
            title: "Pending Approvals",
            text: "Human-in-the-loop decisions awaiting review.",
            list: [
              ["appr_1128", "Customer export | high risk"],
              ["appr_1130", "Tool call outside allowlist"],
              ["appr_1132", "Budget override request"]
            ]
          },
          {
            title: "Approval SLA",
            text: "Track latency and breach risk.",
            chips: ["P50: 3m", "P95: 11m", "Breaches: 1"]
          },
          {
            title: "Escalation",
            text: "Escalate unresolved approvals to incident channels.",
            chips: ["Pager active", "Escalations: 2", "Ack rate: 100%"]
          },
          {
            span: "full",
            title: "Decision Feed",
            text: "Most recent approval outcomes.",
            list: [
              ["appr_1125 approved", "12:59 UTC"],
              ["appr_1124 rejected", "12:51 UTC"],
              ["appr_1122 approved", "12:44 UTC"]
            ]
          }
        ]
      },
      admin: {
        cards: [
          {
            title: "Access & Roles",
            text: "Manage tenant admins, builders, and operator scopes.",
            chips: ["Users: 26", "Tenant admins: 3", "MFA: 100%"]
          },
          {
            title: "Policy Baseline",
            text: "Enforce tool allowlists and workflow guardrails.",
            chips: ["High-risk tools: 7", "Policy version: 12", "Drift: none"]
          },
          {
            title: "Keys & Secrets",
            text: "Control API credentials and rotation posture.",
            chips: ["Last rotation: 9d", "Expires in: 21d", "Leaked keys: 0"]
          },
          {
            span: "full",
            title: "Tenant Controls",
            text: "Region, retention, and quota controls for enterprise workloads.",
            list: [
              ["Region", "us-east-1"],
              ["Retention", "180 days"],
              ["Quota usage", "63%"]
            ]
          }
        ]
      },
      observability: {
        cards: [
          {
            title: "Service SLO",
            text: "Operational reliability and latency trends.",
            chips: ["Uptime: 99.96%", "p95: 280ms", "Error rate: 0.41%"]
          },
          {
            title: "Cost Lens",
            text: "Model and tool spend by workflow and tenant.",
            chips: ["Today: $184.22", "Burn: 71%", "Anomalies: 0"]
          },
          {
            title: "Trace Coverage",
            text: "Audit completeness across workflow runs.",
            chips: ["Coverage: 97%", "Missing spans: 2", "Alerts: 1"]
          },
          {
            span: "full",
            title: "Alert Stream",
            text: "Latest alerts from platform monitoring.",
            list: [
              ["High retry spike", "13:18 UTC"],
              ["Approval queue delay", "12:44 UTC"],
              ["Tenant quota near limit", "11:59 UTC"]
            ]
          }
        ]
      }
    };

    const builderState = {
      workflows: [
        ["Invoice Reconciliation", "v12"],
        ["Vendor Onboarding", "draft"],
        ["Claims Fraud Review", "v4"]
      ],
      nodes: [
        { type: "trigger", kind: "Webhook Trigger", name: "invoice.received", meta: "Input schema v3", x: 30, y: 56 },
        { type: "llm", kind: "LLM Planner", name: "Classify + route", meta: "model: gpt-5-mini", x: 260, y: 36 },
        { type: "tool", kind: "Tool Node", name: "ERP Lookup", meta: "timeout: 4s, retry: 2", x: 500, y: 96 },
        { type: "approval", kind: "Approval Gate", name: "Manager Approval", meta: "SLA: 15m", x: 740, y: 64 },
        { type: "tool", kind: "Tool Node", name: "Post Journal", meta: "idempotency: on", x: 980, y: 128 }
      ],
      connectors: [
        { x: 208, y: 104, w: 56, r: -17 },
        { x: 438, y: 100, w: 72, r: 9 },
        { x: 679, y: 122, w: 66, r: -13 },
        { x: 920, y: 122, w: 66, r: 16 }
      ]
    };

    const tabsEl = document.getElementById("tabs");
    const contentEl = document.getElementById("content");

    function renderBuilder() {
      const workflowItems = builderState.workflows
        .map(([name, version]) => `<li class="nav-item"><span>${name}</span><span class="badge">${version}</span></li>`)
        .join("");

      const nodes = builderState.nodes
        .map(node => `
          <article class="node type-${node.type}" style="left:${node.x}px; top:${node.y}px;">
            <div class="node-kind">${node.kind}</div>
            <div class="node-name">${node.name}</div>
            <div class="node-meta">${node.meta}</div>
          </article>
        `)
        .join("");

      const connectors = builderState.connectors
        .map(c => `<span class="connector" style="left:${c.x}px; top:${c.y}px; width:${c.w}px; transform: rotate(${c.r}deg);"></span>`)
        .join("");

      contentEl.innerHTML = `
        <section class="workspace">
          <aside class="panel">
            <h2 class="section-title">Workflow Catalog</h2>
            <ul class="nav-list">${workflowItems}</ul>
            <h2 class="section-title" style="margin-top:0.9rem;">Node Library</h2>
            <ul class="nav-list">
              <li class="nav-item"><span>Triggers</span><span class="badge">5</span></li>
              <li class="nav-item"><span>AI Steps</span><span class="badge">8</span></li>
              <li class="nav-item"><span>Tool Calls</span><span class="badge">14</span></li>
              <li class="nav-item"><span>Approvals</span><span class="badge">3</span></li>
            </ul>
          </aside>

          <section class="builder-main">
            <div class="kpi-row">
              <article class="kpi-card"><div class="kpi-label">Draft Version</div><div class="kpi-value">Invoice Reconciliation v13-draft</div></article>
              <article class="kpi-card"><div class="kpi-label">Validation</div><div class="kpi-value">0 errors, 1 warning</div></article>
              <article class="kpi-card"><div class="kpi-label">Policy Guard</div><div class="kpi-value">All checks passing</div></article>
              <article class="kpi-card"><div class="kpi-label">Last Save</div><div class="kpi-value">14 seconds ago</div></article>
            </div>

            <article class="canvas">
              <div class="canvas-head">
                <h2 class="section-title">Workflow Canvas</h2>
                <div class="canvas-tools">
                  <span class="tool-btn">Auto Layout</span>
                  <span class="tool-btn">Dry Run</span>
                  <span class="tool-btn">Publish</span>
                </div>
              </div>
              <div class="stage">${connectors}${nodes}</div>
            </article>
          </section>

          <aside class="inspector">
            <article class="panel">
              <h2 class="section-title">Node Inspector</h2>
              <div class="kv">
                <div class="row"><span>Selected Node</span><span>Manager Approval</span></div>
                <div class="row"><span>Type</span><span>Human Approval</span></div>
                <div class="row"><span>SLA</span><span>15 minutes</span></div>
                <div class="row"><span>Escalation</span><span>Ops Channel</span></div>
              </div>
            </article>

            <article class="panel">
              <h2 class="section-title">Run Readiness</h2>
              <div class="chip-row">
                <span class="chip">Schema valid</span>
                <span class="chip">Retries configured</span>
                <span class="chip warn">1 policy warning</span>
              </div>
              <ul class="list">
                <li><span>POST /v1/workflows</span><span class="mono">create</span></li>
                <li><span>POST /v1/workflows/{id}/publish</span><span class="mono">version</span></li>
                <li><span>POST /v1/workflows/{id}/simulate</span><span class="mono">dry-run</span></li>
              </ul>
            </article>

            <article class="panel">
              <h2 class="section-title">Live Queue</h2>
              <ul class="list">
                <li><span>tr_9ca82f2</span><span class="mono">running</span></li>
                <li><span>tr_4db770a</span><span class="mono">completed</span></li>
                <li><span>tr_1aa72cc</span><span class="mono">failed</span></li>
              </ul>
            </article>
          </aside>
        </section>
      `;
    }

    function renderOps(viewKey) {
      const view = views[viewKey];
      contentEl.innerHTML = `
        <section class="ops-grid">
          ${view.cards.map(card => {
            const chips = (card.chips || []).map(c => {
              const cls = c.toLowerCase().includes("breach") || c.toLowerCase().includes("failed") ? "chip bad" : (c.toLowerCase().includes("alert") || c.toLowerCase().includes("warning") ? "chip warn" : "chip");
              return `<span class="${cls}">${c}</span>`;
            }).join("");

            const list = (card.list || []).map(([left, right]) => `<li><span>${left}</span><span class="mono">${right}</span></li>`).join("");
            const spanClass = card.span ? ` ${card.span}` : "";

            return `
              <article class="ops-card${spanClass}">
                <h3>${card.title}</h3>
                <p>${card.text}</p>
                ${chips ? `<div class="chip-row">${chips}</div>` : ""}
                ${list ? `<ul class="list">${list}</ul>` : ""}
              </article>
            `;
          }).join("")}
        </section>
      `;
    }

    function render(viewKey) {
      tabsEl.innerHTML = tabs
        .map(key => `<button class="tab ${key === viewKey ? "active" : ""}" data-key="${key}">${labels[key]}</button>`)
        .join("");

      if (viewKey === "builder") {
        renderBuilder();
        return;
      }

      renderOps(viewKey);
    }

    tabsEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-key]");
      if (!button) return;
      render(button.dataset.key);
    });

    render("builder");
  </script>
</body>
</html>
